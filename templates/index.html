<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A股每日仪表盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 30px 20px;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
  }
  .header-left { flex: 1; }
  .header-center { flex: 1; text-align: center; }
  .header-right { flex: 1; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .date { font-size: 13px; color: #8b949e; }
  .total-label { font-size: 18px; font-weight: 700; color: #8b949e; margin-bottom: 4px; }
  .total-value { font-size: 32px; font-weight: 700; color: #f0f6fc; }
  .total-change { font-size: 15px; font-weight: 600; margin-left: 8px; }
  .total-change.up { color: #f85149; }
  .total-change.down { color: #3fb950; }
  .total-change.flat { color: #8b949e; }

  .cards {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
  }
  .idx-name { font-size: 13px; color: #c9d1d9; font-weight: 600; margin-bottom: 6px; }
  .tag { font-size: 10px; color: #6e7681; margin-left: 4px; font-weight: 400; }
  .idx-price { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .idx-price span { font-size: 13px; font-weight: 600; margin-left: 4px; }
  .up { color: #f85149; }
  .down { color: #3fb950; }
  .flat { color: #8b949e; }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 30px;
    margin-bottom: 8px;
  }
  .bar {
    flex: 1;
    background: #30363d;
    border-radius: 1px;
    min-height: 2px;
  }
  .bottom-line {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #8b949e;
    margin-bottom: 3px;
  }
  .label { font-weight: 600; }
  .label.up-strong { color: #f85149; }
  .label.up { color: #ff7b72; }
  .label.down { color: #3fb950; }
  .label.down-strong { color: #2ea043; }
  .label.warn { color: #d29922; }
  .label.flat { color: #8b949e; }
  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: #484f58;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>📈 A股每日仪表盘</h1>
      <div class="date">数据日期：{{ date }} &nbsp;&nbsp; 更新时间：{{ update_time }}</div>
    </div>
    <div class="header-center">
      <div class="total-label">全市场成交额</div>
      <div class="total-value">{{ total_amount }} <span class="total-change {{ total_change_class }}">{{ total_change }}</span></div>
    </div>
    <div class="header-right"></div>
  </div>

  <div class="cards">
    {{ cards }}
  </div>
  <div class="footer">数据每日自动更新，仅供参考，不构成投资建议。</div>
</div>
</body>
</html>
